<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survey PJU — Bima, Dompu & Kota Bima</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{padding:20px 24px;background:#0b3b60;color:#fff}
header h1{margin:0;font-size:24px}
header p{margin:6px 0 0;font-size:13px;opacity:.9}
main{max-width:1700px;margin:auto;padding:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar select,.toolbar input,.toolbar button{padding:10px 12px;border:1px solid #d7e0ea;border-radius:9px;background:#fff;font:inherit}
.toolbar input{flex:1;min-width:250px}.primary{background:#1565c0!important;color:#fff!important}
.status{margin:12px 0;padding:10px 12px;background:#eef5ff;border-radius:9px}
.kpis{display:grid;grid-template-columns:repeat(9,1fr);gap:9px;margin:12px 0}
.card,.panel{background:#fff;border:1px solid #e1e7ef;border-radius:12px;box-shadow:0 5px 18px rgba(26,61,94,.05)}
.card{padding:12px}.label{font-size:11px;color:#6b7788}.value{font-size:24px;font-weight:800;margin-top:5px}
.layout{display:grid;grid-template-columns:1.55fr 1fr;gap:12px}.panel{padding:12px}.panel h3{margin:0 0 10px}
.map{height:620px;border-radius:9px;overflow:hidden}.tablewrap{max-height:620px;overflow:auto}
.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:8px;border-bottom:1px solid #e7ebf0;text-align:left;vertical-align:top}
.table th{position:sticky;top:0;background:#f8fafc}.pill{display:inline-block;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:700}
.good{background:#e8f5e9;color:#2e7d32}.bad{background:#ffebee;color:#c62828}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(5,1fr)}.layout{grid-template-columns:1fr}}
@media(max-width:650px){main{padding:10px}.kpis{grid-template-columns:repeat(2,1fr)}.map{height:460px}.toolbar input{min-width:100%}}
</style>
</head>
<body>
<header>
<h1>🚦 SURVEY PJU — BIMA, DOMPU & KOTA BIMA</h1>
<p>Monitoring PJU, legalitas, IDPEL, kondisi dan lokasi GPS • ULP Sape • Dompu • Woha • Bikot</p>
</header>
<main>
<div class="toolbar">
<select id="ulp"><option value="">Semua ULP</option><option>ULP Sape</option><option>ULP Dompu</option><option>ULP Woha</option><option>ULP Bikot</option></select>
<select id="wilayah"><option value="">Semua Kabupaten/Kota</option><option>Kabupaten Bima</option><option>Kabupaten Dompu</option><option>Kota Bima</option></select>
<select id="legalitas"><option value="">Semua Legalitas</option><option>LEGAL</option><option>ILEGAL</option></select>
<select id="kondisi"><option value="">Semua Kondisi</option><option>Baik</option><option>Rusak Ringan</option><option>Rusak Berat</option><option>Hilang</option><option>Perlu Pemeriksaan</option></select>
<input id="q" placeholder="Cari ID / IDPEL / nomor tiang / desa / kecamatan / alamat">
<button id="refresh" class="primary">↻ Refresh</button>
<button id="csv">⇩ Export CSV</button>
</div>
<div id="status" class="status">Memuat data terbaru…</div>
<div id="kpis" class="kpis"></div>
<div class="layout">
<section class="panel"><h3>📍 Peta Lokasi Survey PJU</h3><div id="map" class="map"></div></section>
<section class="panel"><h3>🧾 Data Survey Terbaru</h3><div class="tablewrap"><table class="table"><thead><tr><th>ID / IDPEL</th><th>ULP</th><th>Kabupaten/Kota</th><th>Lokasi</th><th>Legalitas</th><th>Kondisi</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
</div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CFG={id:'1IhB-agDYb7WcVSnZioHRWYE9Hm2iQLsJdA72E9jlXWY',sheet:'PJU_Survey'};
let H=[],R=[],F=[],markers;
const $=id=>document.getElementById(id);
const norm=s=>String(s??'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_');
const aliases={
id:['ID Survey','ID'],idpel:['IDPEL'],ulp:['ULP'],kab:['Kabupaten/Kota','Kabupaten_Kota','Kab/Kota'],
legal:['Status Legalitas','Legalitas'],kondisi:['Kondisi Tiang','Kondisi'],gps:['Lokasi GPS','Lokasi_GPS','GPS','LatLong'],
lat:['Latitude','Lat'],lon:['Longitude','Long','Lng'],desa:['Desa/Kelurahan','Desa'],kec:['Kecamatan','Kec'],
alamat:['Alamat','Alamat_Lokasi'],tiang:['Nomor Tiang','Nomor_Tiang','No_Tiang'],tanggal:['Timestamp','Tanggal Survey','Tanggal']
};
function idx(key){for(const a of aliases[key]||[]){const i=H.findIndex(h=>norm(h)===norm(a));if(i>=0)return i}return -1}
function val(row,key){const i=idx(key);return i<0?'':String(row[i]??'')}
function canonicalULP(s){const x=norm(s).replace(/\s+/g,' ');if(['ulp bima kota','bima kota','ulp bikot','bikot'].includes(x))return'ULP Bikot';if(x==='ulp sape')return'ULP Sape';if(x==='ulp dompu')return'ULP Dompu';if(x==='ulp woha')return'ULP Woha';return String(s??'').trim()}
function canonicalKab(s){const x=norm(s).replace(/\s+/g,' ');if(['kabupaten bima','kab bima','bima'].includes(x))return'Kabupaten Bima';if(['kabupaten dompu','kab dompu','dompu'].includes(x))return'Kabupaten Dompu';if(['kota bima','bima kota'].includes(x))return'Kota Bima';return String(s??'').trim()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function parseGViz(t){const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<0)throw Error('Format Google Sheets tidak terbaca');return JSON.parse(t.slice(a,b+1))}
function gps(row){const s=val(row,'gps').replace(';',',');const p=s.split(',').map(Number);if(p.length>=2&&Number.isFinite(p[0])&&Number.isFinite(p[1]))return[p[0],p[1]];const a=Number(val(row,'lat')),b=Number(val(row,'lon'));return Number.isFinite(a)&&Number.isFinite(b)?[a,b]:null}
function filtered(){const u=$('ulp').value,w=$('wilayah').value,l=$('legalitas').value,k=$('kondisi').value,q=$('q').value.toLowerCase().trim();return R.filter(r=>(!u||canonicalULP(val(r,'ulp'))===u)&&(!w||canonicalKab(val(r,'kab'))===w)&&(!l||val(r,'legal').toUpperCase()===l)&&(!k||val(r,'kondisi')===k)&&(!q||[val(r,'id'),val(r,'idpel'),val(r,'tiang'),val(r,'desa'),val(r,'kec'),val(r,'alamat')].join(' ').toLowerCase().includes(q)))} 
function draw(){F=filtered();const le=F.filter(r=>val(r,'legal').toUpperCase()==='LEGAL').length,il=F.filter(r=>val(r,'legal').toUpperCase()==='ILEGAL').length,ni=F.filter(r=>val(r,'legal').toUpperCase()==='LEGAL'&&!val(r,'idpel').trim()).length,bad=F.filter(r=>['Rusak Ringan','Rusak Berat','Hilang','Perlu Pemeriksaan'].includes(val(r,'kondisi'))).length;const cards=[['Total PJU',F.length],['LEGAL',le],['ILEGAL',il],['Legal Tanpa IDPEL',ni],['ULP Sape',F.filter(r=>canonicalULP(val(r,'ulp'))==='ULP Sape').length],['ULP Dompu',F.filter(r=>canonicalULP(val(r,'ulp'))==='ULP Dompu').length],['ULP Woha',F.filter(r=>canonicalULP(val(r,'ulp'))==='ULP Woha').length],['ULP Bikot',F.filter(r=>canonicalULP(val(r,'ulp'))==='ULP Bikot').length],['Perlu Penanganan',bad]];$('kpis').innerHTML=cards.map(c=>`<div class="card"><div class="label">${c[0]}</div><div class="value">${c[1].toLocaleString('id-ID')}</div></div>`).join('');$('tbody').innerHTML=F.slice().reverse().slice(0,500).map(r=>`<tr><td><b>${esc(val(r,'id'))||'-'}</b><br><small>IDPEL: ${esc(val(r,'idpel'))||'-'}<br>${esc(val(r,'tanggal'))}</small></td><td>${esc(canonicalULP(val(r,'ulp')))||'-'}</td><td>${esc(canonicalKab(val(r,'kab')))||'-'}</td><td>${esc([val(r,'desa'),val(r,'kec')].filter(Boolean).join(', '))}<br><small>${esc(val(r,'alamat'))}</small></td><td><span class="pill ${val(r,'legal').toUpperCase()==='LEGAL'?'good':'bad'}">${esc(val(r,'legal'))||'-'}</span></td><td>${esc(val(r,'kondisi'))||'-'}</td></tr>`).join('')||'<tr><td colspan="6">Tidak ada data.</td></tr>';plot();$('status').textContent=`Menampilkan ${F.length.toLocaleString('id-ID')} data.`}
function plot(){markers.clearLayers();const b=[];F.forEach(r=>{const p=gps(r);if(!p)return;const l=val(r,'legal').toUpperCase(),m=L.circleMarker(p,{radius:7,weight:2,color:'#fff',fillColor:l==='ILEGAL'?'#c62828':(canonicalULP(val(r,'ulp'))==='ULP Bikot'?'#ef6c00':'#1565c0'),fillOpacity:.95});m.bindPopup(`<b>${esc(val(r,'id'))||'-'}</b><br>IDPEL: ${esc(val(r,'idpel'))||'-'}<br>ULP: ${esc(canonicalULP(val(r,'ulp')))||'-'}<br>Kabupaten/Kota: ${esc(canonicalKab(val(r,'kab')))||'-'}<br>Legalitas: ${esc(val(r,'legal'))||'-'}<br>GPS: ${p[0]}, ${p[1]}<br>${esc(val(r,'desa'))}, ${esc(val(r,'kec'))}<br>${esc(val(r,'alamat'))}`);m.addTo(markers);b.push(p)});if(b.length)map.fitBounds(b,{padding:[15,15],maxZoom:15})}
async function load(){const btn=$('refresh');btn.disabled=true;$('status').textContent='Mengambil data terbaru…';try{const u=`https://docs.google.com/spreadsheets/d/${CFG.id}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(CFG.sheet)}&tq=${encodeURIComponent('select *')}&_=${Date.now()}`;const res=await fetch(u,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const d=parseGViz(await res.text());H=d.table.cols.map(c=>c.label||'');R=d.table.rows.map(r=>r.c.map(c=>c?.v??''));draw()}catch(e){$('status').textContent='Gagal membaca data: '+e.message;$('tbody').innerHTML='<tr><td colspan="6">Data tidak tersedia.</td></tr>'}finally{btn.disabled=false}}
function downloadCSV(){const csv=[H,...F].map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='survey_pju_export.csv';a.click()}
const map=L.map('map').setView([-8.55,118.62],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap contributors'}).addTo(map);markers=L.layerGroup().addTo(map);
$('refresh').onclick=load;$('csv').onclick=downloadCSV;['ulp','wilayah','legalitas','kondisi'].forEach(id=>$(id).addEventListener('change',draw));$('q').addEventListener('input',draw);load();
</script>
</body>
</html>
